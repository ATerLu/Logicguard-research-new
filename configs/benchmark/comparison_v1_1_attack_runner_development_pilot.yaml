schema_version: 1
benchmark_version: comparison-v1.1
run_mode: execute
input_manifest: artifacts/benchmark/e1_preparation/comparison_v1_1_development_attack_inputs.jsonl
attacks: [A1_poisonedrag, A3_gragpoison]
datasets: [hotpotqa, musique]
split: development
model: qwen3.7-plus
api_key_env: DASHSCOPE_API_KEY
base_url_env: DASHSCOPE_BASE_URL
default_base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
timeout_seconds: 120
matched_documents_per_target: 1
pricing:
  input_per_million_tokens_cny: 2.0
  output_per_million_tokens_cny: 8.0
  hard_cost_cap_cny: 0.14
  per_attack_token_caps:
    A1_poisonedrag:
      input_per_call: 6000
      output_per_call: 1600
    A3_gragpoison:
      input_per_call: 6000
      output_per_call: 3200
outputs:
  request_plan: artifacts/benchmark/e1_preparation/development_pilot/comparison_v1_1_attack_request_plan.jsonl
  results: artifacts/benchmark/e1_preparation/development_pilot/comparison_v1_1_attack_results.jsonl
  summary: artifacts/benchmark/e1_preparation/development_pilot/comparison_v1_1_attack_summary.json

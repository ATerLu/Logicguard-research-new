    real_trace_zero_coverage_T0_T1_contract: passed_two_backends_four_contexts_zero_failures
    real_trusted_pool_T0_T1_execution: not_run
    D6_equal_information_contract_integration: pending
    T0_T1_entry_point: logicguard.benchmark.trusted_control_runner
    A1_official_asset_anchor: passed_100_queries_500_texts_not_backend_effect
    A3_official_artifact_anchor: passed_74_rows_with_budget_and_deduplication_caveats
    A1_A3_qualification_entry_point: logicguard.benchmark.wp2_qualification_runner
    A1_A3_common_dev_materializer: passed_on_two_existing_generation_valid_pilot_attempts_not_full_dev60
    A1_A3_materialization_entry_point: logicguard.benchmark.attack_corpus_materializer
    real_LightRAG_trace_entry_point: logicguard.benchmark.lightrag_trace_capture

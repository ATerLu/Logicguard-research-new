# First offline LogicGuard defense run.
#
# This reads existing clean and poisoned retrieval traces, applies transparent
# risk-based reranking, and reports whether poisoned evidence exposure drops.
dataset: 2wikimultihopqa
reference_corpus_path: ../external_repos/logicPoison/datasets/2wikimultihopqa/corpus.jsonl
clean_corpus_path: ../external_repos/logicPoison/datasets/2wikimultihopqa/corpus.jsonl
clean_trace_path: outputs/baseline/2wikimultihopqa/debug_50_traces.jsonl
clean_corpus_entity_path: outputs/baseline/2wikimultihopqa/corpus_entities.jsonl
entity_swap_corpus_path: outputs/attacks/entity_swap/2wikimultihopqa/poisoned_corpus.jsonl
entity_swap_trace_path: outputs/attacks/entity_swap/2wikimultihopqa/poisoned_debug_50_traces.jsonl
entity_swap_corpus_entity_path: outputs/attacks/entity_swap/2wikimultihopqa/poisoned_corpus_entities.jsonl
entity_swap_attack_metadata_path: outputs/attacks/entity_swap/2wikimultihopqa/entity_swap_metadata.jsonl
bridge_corpus_path: outputs/attacks/bridge_injection/2wikimultihopqa/bridge_poisoned_corpus.jsonl
bridge_trace_path: outputs/attacks/bridge_injection/2wikimultihopqa/bridge_poisoned_debug_50_traces.jsonl
bridge_corpus_entity_path: outputs/attacks/bridge_injection/2wikimultihopqa/bridge_poisoned_corpus_entities.jsonl
bridge_attack_metadata_path: outputs/attacks/bridge_injection/2wikimultihopqa/bridge_injection_metadata.jsonl
reference_corpus_entity_path: outputs/baseline/2wikimultihopqa/corpus_entities.jsonl
output_root: outputs/defense/logicguard_mvp
report_path: outputs/reports/logicguard_mvp_2wikimultihopqa_debug_50.md
top_k: 10
risk_penalty: 0.75
risk_threshold: 0.90

report_title: LogicPoison 阶段8非Oracle Recovery回答层综合报告
experiment_description: 本报告保留阶段6 BM25回答层实验中的 clean、poisoned 与 guarded 判分结果，并用阶段8在可信 clean corpus 上重新检索得到的 non-oracle recovered 结果替换原 oracle recovered，用于判断更真实的 recovery 是否仍能降低攻击错误输出并恢复回答可用性。


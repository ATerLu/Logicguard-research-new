    report_paths:
      - outputs/reports/bridge_injection_exposure_2wikimultihopqa_full_500.md
      - outputs/reports/entity_swap_exposure_2wikimultihopqa_full_500.md
    key_result: Bridge暴露率接近1；Entity Swap暴露率较低且跨数据集差异明显。
    limitations: 攻击模板可见性较强，不能代表了解防御细节的自适应攻击者。
    reproduction_command: ".venv\\Scripts\\python.exe -m logicguard.experiments.run_multidataset --config configs/multidataset_full_500.yaml"


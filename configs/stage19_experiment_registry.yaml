      - configs/entity_swap_attack_full_500.yaml
    input_paths:
      - data/processed/2wikimultihopqa/samples.jsonl
      - data/processed/hotpotqa/samples.jsonl
      - data/processed/musique/samples.jsonl
    output_paths:
      - outputs/attacks/bridge_injection_full_500/2wikimultihopqa/bridge_poisoned_full_500_traces.jsonl
      - outputs/attacks/entity_swap_full_500/2wikimultihopqa/poisoned_full_500_traces.jsonl

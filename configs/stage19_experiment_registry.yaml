registry_version: "1.2"
frozen_at: "2026-06-23"

outputs:
  csv_path: docs/实验注册表.csv
  manifest_path: outputs/registry/stage19_artifact_manifest.json
  report_path: outputs/reports/Stage19_实验冻结与可复现性报告.md

experiments:
  - experiment_id: LG-A01
    main_stage: A
    legacy_stage: 数据准备与验证
    name: 三数据集标准化与完整性验证
    category: infrastructure
    status: completed
    datasets: [2wikimultihopqa, hotpotqa, musique]
    query_count: 1500
    retriever: none
    attack: none
    defense: none
    models: [none]
    metric_version: integrity-v1
    cost_class: local
    config_paths: [configs/data.yaml]
    input_paths:
      - data/processed/2wikimultihopqa/samples.jsonl
      - data/processed/hotpotqa/samples.jsonl
      - data/processed/musique/samples.jsonl
    output_paths: []
    report_paths:
      - outputs/reports/data_validation_2wikimultihopqa.md
      - outputs/reports/data_validation_hotpotqa.md
      - outputs/reports/data_validation_musique.md
    key_result: 每个数据集固定500个query；标准化样本、support文档和答案字段可供后续实验读取。
    limitations: 500-query是研究子集，不代表已经使用原始数据集全部split与全部语料。
    reproduction_command: ".venv\\Scripts\\python.exe -m logicguard.data.prepare --config configs/data.yaml"

  - experiment_id: LG-B01
    main_stage: B
    legacy_stage: GraphRAG baseline full-500
    name: 轻量GraphRAG-style三数据集检索基线
    category: simulation
    status: completed
    datasets: [2wikimultihopqa, hotpotqa, musique]
    query_count: 1500
    retriever: entity-overlap graph surrogate
    attack: none
    defense: none
    models: [none]
    metric_version: retrieval-v1
    cost_class: local
    config_paths: [configs/graphrag_baseline_full_500.yaml]
    input_paths:
      - data/processed/2wikimultihopqa/samples.jsonl
      - data/processed/hotpotqa/samples.jsonl
      - data/processed/musique/samples.jsonl
    output_paths:
      - outputs/baseline/2wikimultihopqa/full_500_traces.jsonl
      - outputs/baseline/hotpotqa/full_500_traces.jsonl
      - outputs/baseline/musique/full_500_traces.jsonl
    report_paths:
      - outputs/reports/graphrag_baseline_2wikimultihopqa_full_500.md
      - outputs/reports/graphrag_baseline_hotpotqa_full_500.md
      - outputs/reports/graphrag_baseline_musique_full_500.md
    key_result: gold_recall@10分别为0.4585、0.4050、0.2595，证明轻量图检索可工作但召回能力有限。
    limitations: 这是NetworkX实体重叠代理，不是Microsoft GraphRAG官方local/global query。
    reproduction_command: ".venv\\Scripts\\python.exe -m logicguard.graph.run_baseline --config configs/graphrag_baseline_full_500.yaml"


    key_result: 在当前模拟攻击上可找到使污染暴露显著下降的阈值区域，但存在召回与拒答折中。
    limitations: 阈值在已知攻击分布上选择，尚缺独立验证集和跨攻击校准。
    reproduction_command: ".venv\\Scripts\\python.exe -m logicguard.defense.run_threshold_scan --config configs/logicguard_threshold_scan_full_500.yaml"


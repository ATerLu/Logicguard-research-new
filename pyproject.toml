[project]
name = "logicguard"
version = "0.1.0"
description = "LogicGuard: path-centric defense experiments for GraphRAG logical poisoning"
readme = "README.md"
authors = [
    { name = "ATerLu", email = "1548183458@qq.com" }
]
requires-python = ">=3.11"
dependencies = [
    "click>=8.4.1",
    "faiss-cpu>=1.14.3",
    "jsonlines>=4.0.0",
    "loguru>=0.7.3",
    "networkx>=3.6.1",
    "numpy>=2.4.6",
    "pandas>=3.0.3",
    "pyarrow>=24.0.0",
    "pydantic>=2.13.4",
    "pyvis>=0.3.2",
    "pyyaml>=6.0.3",
    "rank-bm25>=0.2.2",
    "rich>=15.0.0",
    "scikit-learn>=1.9.0",
    "sentence-transformers>=5.6.0",
    "spacy>=3.8.14",
    "tqdm>=4.68.2",
]

[build-system]
requires = ["uv_build>=0.11.21,<0.12.0"]
build-backend = "uv_build"

[[tool.uv.index]]
url = "https://pypi.tuna.tsinghua.edu.cn/simple"
default = true

[dependency-groups]
dev = [
    "pytest>=9.1.0",
    "ruff>=0.15.17",
]
